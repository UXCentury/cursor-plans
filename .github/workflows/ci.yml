# Run parser tests and prove the extension still packages.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npx --yes @vscode/vsce package --no-dependencies --out /tmp/cursor-plans.vsix
